<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Minimal Markdown resume viewer and PDF exporter" />
  <title>Resume</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --paper: #ffffff;
      --text: #172033;
      --muted: #637083;
      --line: #dce2ea;
      --accent: #155eef;
      --accent-hover: #004eeb;
      --danger-bg: #fff4f4;
      --danger-text: #b42318;
      --shadow: 0 12px 32px rgba(16, 24, 40, 0.09);
      --radius: 14px;
      --page-width: 210mm;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 10px clamp(16px, 4vw, 42px);
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .brand { min-width: 0; }
    .brand strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
    .brand span { display: block; color: var(--muted); font-size: 12px; }

    .actions { display: flex; align-items: center; gap: 8px; }

    button, .file-label {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    button:hover, .file-label:hover { background: #f8fafc; border-color: #bcc6d4; }
    button:active, .file-label:active { transform: translateY(1px); }
    button:focus-visible, .file-label:focus-visible { outline: 3px solid rgba(21, 94, 239, .22); outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .65; }

    .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    input[type="file"] { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }

    main { padding: 34px 16px 64px; }

    .status {
      width: min(var(--page-width), 100%);
      margin: 0 auto 14px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
    }
    .status.error { border-color: #f4c7c3; background: var(--danger-bg); color: var(--danger-text); }
    .status[hidden] { display: none; }

    #resume {
      width: min(var(--page-width), 100%);
      min-height: 297mm;
      margin: 0 auto;
      padding: 18mm 17mm;
      overflow-wrap: anywhere;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    #resume > :first-child { margin-top: 0; }
    #resume > :last-child { margin-bottom: 0; }
    #resume h1, #resume h2, #resume h3, #resume h4 {
      color: #101828;
      line-height: 1.25;
      page-break-after: avoid;
      break-after: avoid;
    }
    #resume h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.035em; }
    #resume h2 { margin: 26px 0 10px; padding-bottom: 5px; border-bottom: 1px solid #bfc7d2; font-size: 18px; letter-spacing: -0.015em; }
    #resume h3 { margin: 18px 0 6px; font-size: 15px; }
    #resume h4 { margin: 14px 0 5px; font-size: 14px; }
    #resume p { margin: 7px 0; }
    #resume ul, #resume ol { margin: 7px 0 10px; padding-left: 22px; }
    #resume li { margin: 3px 0; }
    #resume a { color: #174ea6; text-decoration: none; border-bottom: 1px solid #a9bee3; }
    #resume strong { color: #111827; }
    #resume hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line); }
    #resume blockquote { margin: 12px 0; padding: 2px 0 2px 14px; border-left: 3px solid #aab4c3; color: #475467; }
    #resume code { padding: 1px 4px; border-radius: 4px; background: #f2f4f7; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; }
    #resume pre { overflow: auto; padding: 12px; border-radius: 8px; background: #f2f4f7; white-space: pre-wrap; }
    #resume pre code { padding: 0; background: transparent; }
    #resume img { display: block; max-width: 100%; height: auto; margin: 12px auto; }
    #resume table { width: 100%; margin: 12px 0; border-collapse: collapse; font-size: 13px; }
    #resume th, #resume td { padding: 7px 8px; border: 1px solid #d0d5dd; text-align: left; vertical-align: top; }
    #resume th { background: #f8fafc; font-weight: 700; }
    #resume p, #resume li, #resume table, #resume blockquote, #resume pre { break-inside: avoid; page-break-inside: avoid; }

    .loading { color: var(--muted); text-align: center; padding-top: 80px; }

    @media (max-width: 680px) {
      .toolbar { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; }
      button, .file-label { flex: 1; }
      main { padding: 16px 0 40px; }
      .status { width: calc(100% - 24px); }
      #resume { min-height: 0; padding: 24px 20px; border-left: 0; border-right: 0; border-radius: 0; }
    }

    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; }
      .toolbar, .status { display: none !important; }
      main { padding: 0; }
      #resume { width: 210mm; min-height: 297mm; margin: 0; padding: 18mm 17mm; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="toolbar" aria-label="Resume controls">
    <div class="brand">
      <strong>Resume</strong>
      <span id="fileName">resume.md</span>
    </div>
    <div class="actions">
      <label class="file-label" for="filePicker" title="Open another Markdown file">Open .md</label>
      <input id="filePicker" type="file" accept=".md,text/markdown,text/plain" />
      <button id="downloadButton" class="primary" type="button">Download PDF</button>
    </div>
  </header>

  <main>
    <div id="status" class="status" role="status">Loading resume.md...</div>
    <article id="resume" aria-live="polite"><p class="loading">Loading resume...</p></article>
  </main>

  <script>
    (() => {
      'use strict';

      const DEFAULT_FILE = 'resume.md';
      const resume = document.getElementById('resume');
      const status = document.getElementById('status');
      const fileName = document.getElementById('fileName');
      const filePicker = document.getElementById('filePicker');
      const downloadButton = document.getElementById('downloadButton');

      marked.setOptions({ gfm: true, breaks: true });

      function setStatus(message = '', isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
        status.hidden = !message;
      }

      function renderMarkdown(source, name = DEFAULT_FILE) {
        const rendered = marked.parse(source);
        resume.innerHTML = DOMPurify.sanitize(rendered, { USE_PROFILES: { html: true } });
        fileName.textContent = name;
        document.title = name.replace(/\.md$/i, '') || 'Resume';
        setStatus('');
      }

      async function loadDefaultResume() {
        try {
          const response = await fetch(DEFAULT_FILE, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          renderMarkdown(await response.text(), DEFAULT_FILE);
        } catch (error) {
          resume.innerHTML = `
            <h1>Resume file not loaded</h1>
            <p>Place <strong>resume.md</strong> beside <strong>index.html</strong>, then open the folder through a local or web server.</p>
            <p>You can also use <strong>Open .md</strong> above to select the file directly.</p>`;
          setStatus('Could not automatically load resume.md. Use “Open .md” or run this page through a web server.', true);
        }
      }

      filePicker.addEventListener('change', async (event) => {
        const [file] = event.target.files;
        if (!file) return;
        try {
          renderMarkdown(await file.text(), file.name);
        } catch (error) {
          setStatus('The selected Markdown file could not be read.', true);
        } finally {
          filePicker.value = '';
        }
      });

      downloadButton.addEventListener('click', async () => {
        const previousText = downloadButton.textContent;
        downloadButton.disabled = true;
        downloadButton.textContent = 'Creating PDF...';

        const outputName = `${fileName.textContent.replace(/\.md$/i, '') || 'resume'}.pdf`;
        const options = {
          margin: 0,
          filename: outputName,
          image: { type: 'jpeg', quality: 1 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['h1', 'h2', 'h3', 'p', 'li', 'table', 'blockquote', 'pre'] }
        };

        try {
          await document.fonts.ready;
          await html2pdf().set(options).from(resume).save();
        } catch (error) {
          setStatus('PDF generation failed. Check the browser console or use Print > Save as PDF.', true);
        } finally {
          downloadButton.disabled = false;
          downloadButton.textContent = previousText;
        }
      });

      loadDefaultResume();
    })();
  </script>
</body>
</html>
