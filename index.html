<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Vivek Mohanty — resume" />
  <title>Resume</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #efefef;
      --paper: #ffffff;
      --ink: #161616;
      --muted: #5e5e5e;
      --line: #dedede;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    main {
      padding: 36px 16px 108px;
    }

    #resume {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 52px 56px 60px;
      background: var(--paper);
      border-radius: 2px;
      box-shadow: var(--shadow);
      overflow-wrap: anywhere;
    }

    #resume > :first-child { margin-top: 0; }
    #resume > :last-child { margin-bottom: 0; }

    #resume .intro { text-align: center; }

    #resume h1,
    #resume h2,
    #resume h3 {
      color: var(--ink);
      line-height: 1.25;
      page-break-after: avoid;
      break-after: avoid;
    }

    #resume h1 {
      margin: 0 0 10px;
      font-size: 34px;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    #resume h2 {
      margin: 30px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #111;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #resume h3 {
      margin: 18px 0 2px;
      font-size: 16px;
      font-weight: 650;
    }

    #resume p { margin: 6px 0; }
    #resume .intro p { margin: 4px 0; color: #2a2a2a; }

    #resume h3 + p em {
      color: var(--muted);
      font-style: italic;
    }

    #resume ul,
    #resume ol {
      margin: 6px 0 12px;
      padding-left: 1.15rem;
    }

    #resume li { margin: 4px 0; }
    #resume li::marker { color: #222; }

    #resume a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    #resume hr {
      margin: 18px auto 0;
      width: 72px;
      border: 0;
      border-top: 1px solid #111;
    }

    #resume strong { font-weight: 650; }

    #resume code {
      padding: 1px 4px;
      border-radius: 4px;
      background: #f3f3f3;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.92em;
    }

    .message {
      margin: 0;
      color: var(--muted);
      text-align: center;
    }

    .download {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      background: #000;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }

    .download:hover { background: #1a1a1a; }
    .download:active { transform: translateY(1px); }
    .download:focus-visible { outline: 3px solid rgba(0, 0, 0, 0.28); outline-offset: 3px; }
    .download:disabled { cursor: wait; opacity: 0.7; }

    .download svg { display: block; }

    @media (max-width: 680px) {
      main { padding: 0 0 96px; }
      #resume { padding: 32px 22px 40px; border-radius: 0; }
      #resume h1 { font-size: 28px; }
      .download { right: 16px; bottom: 16px; }
    }

    @media print {
      @page { size: A4; margin: 12mm; }
      body { background: #fff; }
      main { padding: 0; }
      #resume { width: auto; padding: 0; box-shadow: none; }
      .download { display: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <article id="resume" aria-live="polite">
      <p class="message">Loading…</p>
    </article>
  </main>

  <button id="downloadButton" class="download" type="button" disabled>
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none">
      <path d="M8 2.5v7.2M5.2 7.4 8 10.2l2.8-2.8M3.5 13.5h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Download resume</span>
  </button>

  <script>
    (() => {
      'use strict';

      const resume = document.getElementById('resume');
      const downloadButton = document.getElementById('downloadButton');
      const label = downloadButton.querySelector('span');

      marked.setOptions({ gfm: true, breaks: false });

      function prepare(source) {
        return source
          .replace(/<div\b[^>]*>/gi, '')
          .replace(/<\/div>/gi, '')
          .trim();
      }

      function render(source) {
        resume.innerHTML = DOMPurify.sanitize(marked.parse(prepare(source)), {
          USE_PROFILES: { html: true }
        });

        for (const child of resume.children) {
          if (child.tagName === 'H2') break;
          child.classList.add('intro');
        }

        const heading = resume.querySelector('h1');
        const name = heading ? heading.textContent.trim() : 'Resume';
        document.title = name;
        downloadButton.disabled = false;
        return name;
      }

      downloadButton.addEventListener('click', async () => {
        const previous = label.textContent;
        downloadButton.disabled = true;
        label.textContent = 'Preparing…';

        const name = (resume.querySelector('h1')?.textContent || 'Resume').trim();
        const options = {
          margin: 10,
          filename: `${name} Resume.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['h1', 'h2', 'h3', 'p', 'li'] }
        };

        try {
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          await html2pdf().set(options).from(resume).save();
        } catch (error) {
          label.textContent = 'Try again';
          downloadButton.disabled = false;
          return;
        }

        label.textContent = previous;
        downloadButton.disabled = false;
      });

      async function loadResume() {
        try {
          const response = await fetch('resume.md', { cache: 'no-store' });
          if (!response.ok) throw new Error('unavailable');
          render(await response.text());
        } catch (error) {
          resume.innerHTML = '<p class="message">The resume could not be loaded.</p>';
        }
      }

      loadResume();
    })();
  </script>
</body>
</html>
